<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="A day planner that keeps the why next to the plan, and the plan next to what happened."
    />
    <!-- The page colour of each theme (src/styles/theme.css, --background). -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0a0a0a"
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Intent</title>
    <script>
      // Follow the system theme before first paint, so there is no flash.
      // The manual switch (PRD S5) is added in M1.
      (function () {
        var query = window.matchMedia("(prefers-color-scheme: dark)");
        function apply() {
          document.documentElement.classList.toggle("dark", query.matches);
        }
        apply();
        query.addEventListener("change", apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
