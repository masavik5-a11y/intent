<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="A day planner that keeps the why next to the plan, and the plan next to what happened."
    />
    <!-- The page colour of each theme (src/styles/theme.css, --background). -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0a0a0a"
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Intent</title>
    <script>
      // Apply the device's theme choice before first paint, so there is no flash.
      // A copy of applyTheme in src/lib/theme.ts, which takes over once the app runs:
      // keep the two in step.
      (function () {
        var choice = "system";
        try {
          var stored = localStorage.getItem("intent-theme");
          if (stored === "light" || stored === "dark") choice = stored;
        } catch (e) {}
        var systemDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        var theme =
          choice === "system" ? (systemDark ? "dark" : "light") : choice;
        document.documentElement.classList.toggle("dark", theme === "dark");
        if (choice !== "system") {
          var colour = theme === "dark" ? "#0a0a0a" : "#ffffff";
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) metas[i].content = colour;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
